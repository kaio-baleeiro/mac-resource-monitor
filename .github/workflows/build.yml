name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build app
        run: swift build -c release --product MacResourceMonitor
      - name: Build MCP server
        run: swift build -c release --product MacResourceMonitorMCP
      - name: Run MCP scenario suite
        run: ./scripts/test-mcp.sh
      - name: Build MCP Bundle
        run: ./scripts/build-mcpb.sh
